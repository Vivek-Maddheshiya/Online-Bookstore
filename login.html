<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #334155;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .login-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 35px;
            width: 100%;
            max-width: 400px;
        }
        h2 {
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 25px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Login</h2>
        <form>
            <div class="mb-3">
                <label class="form-label">User Name:</label>
                <input type="text" name="username" class="form-control" placeholder="Enter user name">
            </div>
            <div class="mb-4">
                <label class="form-label">Passwords:</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password">
            </div>
            <div class="d-flex gap-2">
                <input type="submit" value="Submit" class="btn btn-primary w-50">
                <input type="reset" value="Reset" class="btn btn-outline-secondary w-50">
            </div>
        </form>
    </div>
    <footer class="text-center py-4 mt-5 border-top bg-white text-muted small">
    <p class="mb-0">&copy; [Roll No. = 422 ] , [Github - https://github.com/Vivek-Maddheshiya] ,[ Live Deployed link - https://online-bookstore-teamx18.vercel.app?_vercel_share=RSkK9LC4HBLyPB6t4ueqbyf3U5IbzSSF ] All rights reserved.</p>
    <p class="mb-0">Online Bookstore Project</p>
</footer>
</body>
</html>

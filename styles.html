<!DOCTYPE html>
<html>
<head>
    <title> </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Georgia', serif;
            color: #333333;
            padding: 40px;
        }
        .demo-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1e293b;
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .element-box {
            background-color: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        
        a:link {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
        a:visited {
            color: #7c3aed;
        }
        a:hover {
            color: #dc2626;
            text-decoration: underline;
        }
        a:active {
            color: #16a34a;
        }
    </style>
</head>
</html>

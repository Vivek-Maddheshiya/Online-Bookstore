<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #334155;
            padding: 30px;
        }
        .cart-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 30px;
            max-width: 800px;
            margin: 0 auto;
        }
        h2 {
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 25px;
        }
        .total-row {
            font-weight: 700;
            background-color: #f1f5f9 !important;
            color: #1e293b;
        }
    </style>
</head>
<body>
    <div class="cart-container">
        <h2>Your Shopping Cart</h2>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Book Name</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Java 2</td>
                        <td>$35.5</td>
                        <td>2</td>
                        <td>$70</td>
                    </tr>
                    <tr>
                        <td>XML Bible</td>
                        <td>$40.5</td>
                        <td>1</td>
                        <td>$40.5</td>
                    </tr>
                    <tr class="total-row">
                        <td colspan="3" class="text-end">Total amount:</td>
                        <td>$110.5</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
 <div class="page-footer">
    <p class="mb-1">&copy; Roll No. = 422 | <a href="https://github.com/Vivek-Maddheshiya/Online-Bookstore.git" target="_blank" class="text-decoration-none">GitHub</a> | <a href="https://online-bookstore-teamx18.vercel.app?_vercel_share=RSkK9LC4HBLyPB6t4ueqbyf3U5IbzSSF" target="_blank" class="text-decoration-none">Deployed Website</a></p>
    <p class="mb-0">Online Bookstore Project &mdash; All rights reserved VM™.</p>
</div>

<style>
    .page-footer {
        text-align: center;
        font-size: 0.85rem;
        color: #64748b;
        margin-top: 20px;
        padding-top: 15px;
        border-top: 1px solid #e2e8f0;
        width: 100%;
    }
    .page-footer a {
        color: #2563eb;
    }
    .page-footer a:hover {
        text-decoration: underline;
    }
</style>
</body>
</html>

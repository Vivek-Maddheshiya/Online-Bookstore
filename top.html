<!DOCTYPE html>
<html>
<head>
    <title>Top Frame</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 8px 20px;
        }
        .navbar-custom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-area img {
            height: 40px;
            border-radius: 6px;
            background: white;
            padding: 2px;
        }
        .logo-area h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
            color: #f8fafc;
            letter-spacing: 0.5px;
        }
        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s ease-in-out;
        }
        .nav-links a:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="navbar-custom">
        <div class="logo-area">
            <img src="gl_bajaj_logo.png" alt="GL Bajaj Logo">
            <h2>GL Bajaj Bookstore</h2>
        </div>
        <div class="nav-links">
            <a href="right.html" target="rightFrame">Home</a>
            <a href="login.html" target="rightFrame">Login</a>
            <a href="registration.html" target="rightFrame">Registration</a>
            <a href="catalogue.html" target="rightFrame">Catalogue</a>
            <a href="cart.html" target="rightFrame">Cart</a>
        </div>
    </div>
    
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #334155;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 35px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        h2 {
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 25px;
            text-align: center;
        }
        .page-footer {
            text-align: center;
            font-size: 0.85rem;
            color: #64748b;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Login</h2>
        <form>
            <div class="mb-3">
                <label class="form-label">User Name:</label>
                <input type="text" name="username" class="form-control" placeholder="Enter user name">
            </div>
            <div class="mb-4">
                <label class="form-label">Password:</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password">
            </div>
            <div class="d-flex gap-2">
                <input type="submit" value="Submit" class="btn btn-primary w-50">
                <input type="reset" value="Reset" class="btn btn-outline-secondary w-50">
            </div>
        </form>
    </div>
  <div class="page-footer">
    <p class="mb-1">&copy; Roll No. = 422 | <a href="https://github.com/Vivek-Maddheshiya/Online-Bookstore.git" target="_blank" class="text-decoration-none">GitHub</a> | <a href="https://online-bookstore-teamx18.vercel.app?_vercel_share=RSkK9LC4HBLyPB6t4ueqbyf3U5IbzSSF" target="_blank" class="text-decoration-none">Deployed Website</a></p>
    <p class="mb-0">Online Bookstore Project &mdash; All rights reserved VM™.</p>
</div>

<style>
    .page-footer {
        text-align: center;
        font-size: 0.85rem;
        color: #64748b;
        margin-top: 20px;
        padding-top: 15px;
        border-top: 1px solid #e2e8f0;
        width: 100%;
    }
    .page-footer a {
        color: #2563eb;
    }
    .page-footer a:hover {
        text-decoration: underline;
    }
</style>
</body>
</html>

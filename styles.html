<!DOCTYPE html>
<html>
<head>
    <title>CSS Styling Demonstration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Georgia', serif;
            color: #333333;
            padding: 40px;
        }
        .demo-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1e293b;
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .element-box {
            background-color: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        /* Link pseudo-classes styling per syllabus requirement */
        a:link {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
        a:visited {
            color: #7c3aed;
        }
        a:hover {
            color: #dc2626;
            text-decoration: underline;
        }
        a:active {
            color: #16a34a;
        }
    </style>
</head>
<body>
    <div class="demo-card">
        <h1>Cascading Style Sheets Demonstration</h1>
        <div class="element-box">
            <p class="mb-0">This is a custom-styled element container demonstrating specific background and font properties[span_0](start_span)[span_0](end_span).</p>
        </div>
        <p>Check out our links below to test CSS pseudo-classes[span_1](start_span)[span_1](end_span):</p>
        <p><a href="https://example.com" target="_blank">Sample Hyperlink</a></p>
    </div>
</body>
</html>
